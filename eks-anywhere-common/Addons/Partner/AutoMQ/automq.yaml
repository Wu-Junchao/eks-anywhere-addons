# HelmRelease for AutoMQ (Kafka)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: automq-release
  namespace: automq
spec:
  interval: 5m
  releaseName: automq-release
  targetNamespace: automq
  install:
    createNamespace: true
  dependsOn:
    - name: minio
      namespace: automq
  chart:
    spec:
      chart: kafka
      version: "31.5.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
        namespace: automq
  values:
    # <<< ADD THIS SECTION to allow the custom image
    global:
      security:
        allowInsecureImages: true
    # 1. 覆盖启动命令
    # command: ["/bin/sh"]
    # args:
    #   - "-c"
    #   - "echo 'Container is in debug mode, sleeping...' && sleep infinity"
    
    image:
      registry: automqinc
      repository: automq
      tag: 1.5.0-bitnami
      pullPolicy: Always
    extraEnvVars:
      - name: KAFKA_S3_ACCESS_KEY
        value: "minioadmin"
      - name: KAFKA_S3_SECRET_KEY
        value: "minioadmin"
    controller:
      # livenessProbe:
      #   enabled: false
      # readinessProbe:
      #   enabled: false
      replicaCount: 1
      resources:
        requests:
          cpu: "1000m"
          memory: "4Gi"
        limits:
          cpu: "2000m"
          memory: "6Gi"
      heapOpts: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g
      extraConfig: |
        elasticstream.enable=true
        autobalancer.client.auth.sasl.mechanism=PLAIN
        autobalancer.client.auth.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="inter_broker_user" password="interbroker-password-placeholder" user_inter_broker_user="interbroker-password-placeholder";
        autobalancer.client.auth.security.protocol=SASL_PLAINTEXT
        autobalancer.client.listener.name=INTERNAL
        s3.wal.cache.size=2147483648
        s3.block.cache.size=1073741824
        s3.stream.allocator.policy=POOLED_DIRECT
        s3.network.baseline.bandwidth=245366784
        s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
        s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
        s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - automq-release
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - controller-eligible
                      - broker
              topologyKey: kubernetes.io/hostname
      persistence:
        size: 20Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: automq
spec:
  interval: 10m
  releaseName: minio
  targetNamespace: automq
  install:
    createNamespace: true
  chart:
    spec:
      chart: minio
      version: 17.0.16
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
        namespace: automq
  values:
    auth:
      rootUser:     minioadmin
      rootPassword: minioadmin
    
    mode: standalone

    # 关键修复：必须添加这个 'args' 部分，
    # 告诉 MinIO 在所有网络接口上监听 API 请求，而不仅仅是 localhost。
    args:
      - "server"
      - "/bitnami/minio/data"      # 这是 MinIO 需要的数据存储路径
      - "--address"
      - ":9000"   # 这是为了让 MinIO 监听所有网络接口
    
    # 语法修复：这里的 key 应该是 'ports' (复数)。
    service:
      type: ClusterIP
      ports: 
        api: 9000

    defaultBuckets: "automq-data,automq-ops"
    