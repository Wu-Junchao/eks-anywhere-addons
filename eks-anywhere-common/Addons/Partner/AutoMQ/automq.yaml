# 1. HelmRelease for AutoMQ (Kafka)
# 它会等待 MinIO 服务就绪，并在自己的 Pod 启动失败时自动重试，
# 直到 minio-bucket-creator Job 完成任务。
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: automq-release
  namespace: automq
spec:
  interval: 5m
  releaseName: automq-release
  targetNamespace: automq
  install:
    createNamespace: true
  dependsOn:
    - name: minio
      namespace: automq
  chart:
    spec:
      chart: kafka
      version: "31.5.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
        namespace: automq
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      registry: automqinc
      repository: automq
      tag: 1.5.0-bitnami
      pullPolicy: Always
    extraEnvVars:
      - name: KAFKA_S3_ACCESS_KEY
        value: "minioadmin"
      - name: KAFKA_S3_SECRET_KEY
        value: "minioadmin"
    controller:
      replicaCount: 1
      resources:
        requests:
          cpu: "1000m"
          memory: "4Gi"
        limits:
          cpu: "2000m"
          memory: "6Gi"
      heapOpts: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g
      extraConfig: |
        elasticstream.enable=true
        autobalancer.client.auth.sasl.mechanism=PLAIN
        autobalancer.client.auth.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="inter_broker_user" password="interbroker-password-placeholder" user_inter_broker_user="interbroker-password-placeholder";
        autobalancer.client.auth.security.protocol=SASL_PLAINTEXT
        autobalancer.client.listener.name=INTERNAL
        s3.wal.cache.size=2147483648
        s3.block.cache.size=1073741824
        s3.stream.allocator.policy=POOLED_DIRECT
        s3.network.baseline.bandwidth=245366784
        s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
        s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
        s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - automq-release
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - controller-eligible
                      - broker
              topologyKey: kubernetes.io/hostname
      persistence:
        size: 20Gi
---
# 2. HelmRelease for MinIO
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: automq
spec:
  interval: 10m
  releaseName: minio
  targetNamespace: automq
  install:
    createNamespace: true
  chart:
    spec:
      chart: minio
      version: 17.0.16
      sourceRef:
        kind: HelmRepository
        name: bitnami-charts
        namespace: automq
  values:
    auth:
      rootUser:     minioadmin
      rootPassword: minioadmin
    mode: standalone
    args:
      - "server"
      - "/bitnami/minio/data"
      - "--address"
      - ":9000"
    service:
      type: ClusterIP
      ports: 
        api: 9000
---
# 3. Kubernetes Job for creating MinIO buckets
# 这个 Job 负责创建 AutoMQ 需要的 buckets。
# 它会在 MinIO 服务可用后自动运行一次。
# Kubernetes Job for initializing MinIO
# 这个 Job 现在负责所有一次性配置：设置 Region 和创建 Buckets。
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-initializer-job
  # 我们改个新名字，方便区分。如果需要重新运行，请先删除旧的 Job：
  # kubectl delete job minio-bucket-creator -n automq
  namespace: automq
spec:
  backoffLimit: 2 # 允许一些重试
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: minio-client
        image: docker.io/bitnami/minio:2025.7.23-debian-12-r0
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e # 如果任何命令失败，脚本将立即退出
            
            echo "--- 1. Waiting for MinIO service to be available..."
            until mc alias set myminio http://minio:9000 minioadmin minioadmin --config-dir /tmp/.mc; do
              echo "waiting for minio service..."
              sleep 5
            done
            
            echo "--- 2. Setting MinIO server region..."
            mc admin config set myminio region name=us-east-1 --config-dir /tmp/.mc
            
            echo "--- 3. Restarting MinIO server to apply region config..."
            mc admin service restart myminio --config-dir /tmp/.mc
            
            echo "--- 4. Waiting for MinIO to restart (waiting 15 seconds)..."
            sleep 15 # 等待服务器重启
            
            # 再次设置别名，因为重启后连接可能断开
            until mc alias set myminio http://minio:9000 minioadmin minioadmin --config-dir /tmp/.mc; do
              echo "waiting for minio service to come back online..."
              sleep 5
            done
            
            echo "--- 5. Verifying region config..."
            mc admin config get myminio region --config-dir /tmp/.mc

            echo "--- 6. Creating buckets..."
            mc mb myminio/automq-data --config-dir /tmp/.mc || true
            mc mb myminio/automq-ops --config-dir /tmp/.mc || true
            
            echo "--- Initialization complete. ---"